<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Galería fotográfica de viajes de Raimon: ciudades, paisajes y rincones capturados por el mundo."
    />
    <title>Viajes de Raimon</title>
    <link
      rel="preload"
      as="image"
      href="./img/optimized/alberobello-large.jpg"
    />
    <link rel="stylesheet" href="./style/style.css" />
    <script src="./fotos.js"></script>
  </head>

  <body>
    <header class="hero">
      <!-- <img
        class="hero__image"
        src="./img/optimized/alberobello-large.jpg"
        alt="Casas blancas de Alberobello durante un viaje"
        fetchpriority="high"
      /> -->
      <div class="hero__content">
        <p class="eyebrow">Galería personal</p>
        <h1>Viajes de Raimon</h1>
        <p>
          Ciudades, caminos, agua, piedra y esos detalles que hacen que un viaje
          vuelva de golpe cuando aparece una foto.
        </p>
      </div>
    </header>
    <main>
      <section class="gallery" aria-label="Fotografías de viajes"></section>
    </main>

    <footer>
      <p>Fotos by Raimon</p>
      <p>
        Una pequeña vuelta al mundo, hecha para disfrutarla en cualquier
        pantalla.
      </p>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      aria-hidden="true"
      role="dialog"
      aria-label="Visor de fotografía"
    >
      <button
        class="lightbox__close"
        type="button"
        aria-label="Cerrar fotografía"
      >
        &times;
      </button>
      <button
        class="lightbox__nav lightbox__nav--prev"
        type="button"
        aria-label="Fotografía anterior"
      >
        &#8249;
      </button>
      <img alt="" id="lightbox-img" />
      <button
        class="lightbox__nav lightbox__nav--next"
        type="button"
        aria-label="Fotografía siguiente"
      >
        &#8250;
      </button>
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>

    <script>
      const fallbackPhotos = [
        {
          title: "Alberobello",
          place: "Italia",
          slug: "alberobello",
          widths: [900, 1600],
          alt: "Casas blancas tradicionales en Alberobello, Italia",
        },
        {
          title: "Arrozales",
          place: "China",
          slug: "arroz-china",
          alt: "Paisaje de arrozales durante un viaje por China",
        },
        {
          title: "Bled",
          place: "Eslovenia",
          slug: "bled",
          alt: "Vista de Bled en Eslovenia",
        },
        {
          title: "Bruselas",
          place: "Bélgica",
          slug: "bruselas",
          alt: "Escena urbana de Bruselas, Bélgica",
        },
        {
          title: "Budapest",
          place: "Hungría",
          slug: "budapest-iglesia",
          alt: "Iglesia y arquitectura de Budapest, Hungría",
        },
        {
          title: "Casa tradicional",
          place: "China",
          slug: "casa-china",
          alt: "Casa tradicional fotografiada en China",
        },
        {
          title: "Costa nórdica",
          place: "Dinamarca",
          slug: "casa-dinamarca",
          alt: "Casa junto a la costa en Dinamarca",
        },
        {
          title: "Castillo",
          place: "Dinamarca",
          slug: "castillo-dinamarca",
          alt: "Castillo fotografiado durante un viaje por Dinamarca",
        },
        {
          title: "Edimburgo",
          place: "Escocia",
          slug: "edimburgo",
          alt: "Vista de Edimburgo en Escocia",
        },
        {
          title: "Letras y color",
          place: "China",
          slug: "letras-china",
          alt: "Detalle con letras y color en China",
        },
        {
          title: "Reflejos",
          place: "China",
          slug: "rio-cina2",
          alt: "Vista de rio y reflejos durante un viaje por China",
        },
        {
          title: "Liubliana",
          place: "Eslovenia",
          slug: "lubliana",
          alt: "Rincón de Liubliana, Eslovenia",
        },
        {
          title: "Frente al mar",
          place: "Dinamarca",
          slug: "man-sea-dinamarca",
          alt: "Persona mirando al mar en Dinamarca",
        },
        {
          title: "Detalle",
          place: "China",
          slug: "objeto-china",
          alt: "Detalle decorativo fotografiado en China",
        },
        {
          title: "Parlamento",
          place: "Budapest",
          slug: "parlamento",
          alt: "Parlamento de Budapest junto al rio",
        },
        {
          title: "Pula",
          place: "Croacia",
          slug: "pula",
          alt: "Arquitectura y calle de Pula, Croacia",
        },
        {
          title: "Rio",
          place: "China",
          slug: "rio-china",
          alt: "Rio y paisaje urbano en China",
        },
        {
          title: "Piedras erráticas",
          place: "Estonia",
          slug: "piedras-erraticas",
          alt: "Vista al Mar Báltico con piedras erráticas",
        },
      ];

      const photos = (window.galleryPhotos || fallbackPhotos).map((photo) => {
        if (!Array.isArray(photo)) return photo;
        const [file, title, place, alt, slug] = photo;

        return {
          file,
          title,
          place,
          alt,
          slug,
        };
      });

      const gallery = document.querySelector(".gallery");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxCaption = document.getElementById("lightbox-caption");
      const closeButton = lightbox.querySelector(".lightbox__close");
      const prevButton = lightbox.querySelector(".lightbox__nav--prev");
      const nextButton = lightbox.querySelector(".lightbox__nav--next");

      let currentIndex = 0;

      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;

      gallery.innerHTML = photos
        .map((photo, index) => {
          const [smallWidth, largeWidth] = photo.widths || [900, 1800];
          const loading = index === 0 ? "eager" : "lazy";
          const small = `./img/optimized/${photo.slug}-small.jpg`;
          const large = `./img/optimized/${photo.slug}-large.jpg`;
          const original = `./img/${photo.file || `${photo.slug}.jpg`}`;

          return `
        <figure class="photo-card">
          <button
            type="button"
            data-full="${large}"
            data-original="${original}"
            data-title="${photo.title}"
            data-place="${photo.place}"
          >
            <img
              src="${small}"
              srcset="${small} ${smallWidth}w, ${large} ${largeWidth}w"
              sizes="(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 33vw"
              alt="${photo.alt}"
              loading="${loading}"
              decoding="async"
              onerror="this.onerror=null; this.src='${original}'; this.removeAttribute('srcset'); this.closest('button').dataset.full='${original}';"
            />
            <figcaption><span>${photo.title}</span><small>${photo.place}</small></figcaption>
          </button>
        </figure>
      `;
        })
        .join("");

      const cards = [...document.querySelectorAll(".photo-card")];
      const buttons = cards.map((card) => card.querySelector("button"));

      const revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        },
        { rootMargin: "0px 0px -8% 0px", threshold: 0.08 },
      );

      cards.forEach((card) => revealObserver.observe(card));

      function preloadPhoto(index) {
        if (!buttons.length) return;

        const safeIndex = (index + buttons.length) % buttons.length;
        const button = buttons[safeIndex];

        const image = new Image();

        image.src = button.dataset.full;

        image.onerror = () => {
          image.onerror = null;
          image.src = button.dataset.original;
        };
      }

      function preloadNearbyPhotos(index) {
        preloadPhoto(index - 1);
        preloadPhoto(index + 1);
      }

      function showPhoto(index) {
        currentIndex = (index + buttons.length) % buttons.length;

        const button = buttons[currentIndex];
        const title = button.dataset.title;
        const place = button.dataset.place;

        const full = button.dataset.full;
        const original = button.dataset.original;

        const imageLoader = new Image();

        imageLoader.onload = () => {
          lightboxImg.src = imageLoader.src;
        };

        imageLoader.onerror = () => {
          lightboxImg.src = original;
        };

        imageLoader.src = full;

        lightboxImg.alt = button.querySelector("img").alt;
        lightboxCaption.textContent = `${title} · ${place}`;

        preloadNearbyPhotos(currentIndex);
      }

      function openLightbox(index) {
        showPhoto(index);
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.classList.add("no-scroll");
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("no-scroll");
        buttons[currentIndex].focus();
      }

      function previousPhoto() {
        showPhoto(currentIndex - 1);
      }

      function nextPhoto() {
        showPhoto(currentIndex + 1);
      }

      function handleSwipe() {
        const differenceX = touchEndX - touchStartX;
        const differenceY = touchEndY - touchStartY;

        const minimumSwipeDistance = 45;

        if (
          Math.abs(differenceX) < minimumSwipeDistance ||
          Math.abs(differenceX) <= Math.abs(differenceY)
        ) {
          return;
        }

        if (differenceX > 0) {
          previousPhoto();
        } else {
          nextPhoto();
        }
      }

      buttons.forEach((button, index) => {
        button.addEventListener("click", () => openLightbox(index));
      });

      closeButton.addEventListener("click", closeLightbox);
      prevButton.addEventListener("click", previousPhoto);
      nextButton.addEventListener("click", nextPhoto);

      lightbox.addEventListener(
        "touchstart",
        (event) => {
          if (!event.changedTouches.length) return;

          const touch = event.changedTouches[0];

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;

          touchEndX = touchStartX;
          touchEndY = touchStartY;
        },
        { passive: true },
      );

      lightbox.addEventListener(
        "touchmove",
        (event) => {
          if (!event.changedTouches.length) return;

          const touch = event.changedTouches[0];

          touchEndX = touch.clientX;
          touchEndY = touch.clientY;
        },
        { passive: true },
      );

      lightbox.addEventListener(
        "touchend",
        (event) => {
          if (!event.changedTouches.length) return;

          const touch = event.changedTouches[0];

          touchEndX = touch.clientX;
          touchEndY = touch.clientY;

          handleSwipe();
        },
        { passive: true },
      );

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("is-open")) return;

        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") showPhoto(currentIndex - 1);
        if (event.key === "ArrowRight") showPhoto(currentIndex + 1);
      });

      function detectDevice() {
        const userAgent = navigator.userAgent || "";

        if (/iPad/i.test(userAgent)) {
          return "iPad";
        }

        if (/iPhone/i.test(userAgent)) {
          return "iPhone";
        }

        if (/Android/i.test(userAgent)) {
          return /Mobile/i.test(userAgent) ? "Móvil Android" : "Tablet Android";
        }

        if (/Windows/i.test(userAgent)) {
          return "Ordenador Windows";
        }

        if (/Macintosh|Mac OS X/i.test(userAgent)) {
          return "Mac";
        }

        if (/Linux/i.test(userAgent)) {
          return "Ordenador Linux";
        }

        return "Dispositivo desconocido";
      }

      function detectBrowser() {
        const userAgent = navigator.userAgent || "";

        if (/Instagram/i.test(userAgent)) {
          return "Navegador interno de Instagram";
        }

        if (/Edg\//i.test(userAgent)) {
          return "Microsoft Edge";
        }

        if (/OPR\//i.test(userAgent)) {
          return "Opera";
        }

        if (/CriOS/i.test(userAgent)) {
          return "Chrome iOS";
        }

        if (/FxiOS/i.test(userAgent)) {
          return "Firefox iOS";
        }

        if (/Chrome/i.test(userAgent)) {
          return "Google Chrome";
        }

        if (/Safari/i.test(userAgent)) {
          return "Safari";
        }

        if (/Firefox/i.test(userAgent)) {
          return "Firefox";
        }

        return "Navegador desconocido";
      }

      function getTrafficSource() {
        const params = new URLSearchParams(window.location.search);

        const utmSource = params.get("utm_source");
        const utmMedium = params.get("utm_medium");
        const utmCampaign = params.get("utm_campaign");

        if (utmSource) {
          return {
            source: utmSource,
            medium: utmMedium || "",
            campaign: utmCampaign || "",
          };
        }

        if (
          document.referrer &&
          document.referrer.toLowerCase().includes("instagram")
        ) {
          return {
            source: "instagram",
            medium: "referrer",
            campaign: "",
          };
        }

        if (
          navigator.userAgent &&
          navigator.userAgent.toLowerCase().includes("instagram")
        ) {
          return {
            source: "instagram",
            medium: "app",
            campaign: "",
          };
        }

        if (
          document.referrer &&
          document.referrer.toLowerCase().includes("facebook")
        ) {
          return {
            source: "facebook",
            medium: "referrer",
            campaign: "",
          };
        }

        if (document.referrer) {
          try {
            return {
              source: new URL(document.referrer).hostname,
              medium: "referrer",
              campaign: "",
            };
          } catch {
            return {
              source: document.referrer,
              medium: "referrer",
              campaign: "",
            };
          }
        }

        return {
          source: "direct",
          medium: "",
          campaign: "",
        };
      }

      async function registerVisit() {
        try {
          const traffic = getTrafficSource();

          const visitData = {
            page: window.location.pathname,
            pageTitle: document.title,
            source: traffic.source,
            medium: traffic.medium,
            campaign: traffic.campaign,
            referrer: document.referrer || "",
            device: detectDevice(),
            browser: detectBrowser(),
            language: navigator.language || "",
            screenWidth: window.screen?.width || null,
            screenHeight: window.screen?.height || null,
            viewportWidth: window.innerWidth || null,
            viewportHeight: window.innerHeight || null,
            localDate: new Date().toLocaleString("es-ES"),
          };

          await fetch("/.netlify/functions/visit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(visitData),
            keepalive: true,
          });
        } catch (error) {
          console.warn("No se pudo registrar la visita.");
        }
      }

      window.addEventListener("load", () => {
        if (buttons.length > 0) {
          preloadPhoto(0);
          preloadPhoto(1);
        }

        registerVisit();
      });
    </script>
  </body>
</html>
